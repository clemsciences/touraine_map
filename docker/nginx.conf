server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # Redirections relatives, pour garder le port publié par Docker (-p 8080:80)
    absolute_redirect off;

    location = / {
        return 302 /touraine_map/;
    }

    location /touraine_map/ {
        try_files $uri $uri/ /touraine_map/index.html;
    }

    # Les fichiers de Vite ont un nom haché : on peut les garder longtemps en cache
    location /touraine_map/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fichier de données, remplaçable sans recompiler : toujours revalidé par le navigateur
    location = /touraine_map/data.yaml {
        default_type application/yaml;
        add_header Cache-Control "no-cache";
    }

    # Absent des types MIME par défaut de nginx
    location ~ \.geojson$ {
        default_type application/geo+json;
    }
}
